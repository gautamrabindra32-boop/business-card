
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabindra Gautam - Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="business-card">

        <div class="card-header">
            <div class="profile-logo">RG</div>

            <div class="profile-info">
                <h1>Rabindra Gautam</h1>
                <p class="job-title">Web Designer & Developer</p>
            </div>
        </div>

        <div class="divider"></div>

        <p class="description">
            Passionate about creating clean, modern, and
            user-friendly digital experiences.
        </p>

        <div class="contact-info">
            <p>
                <span class="icon">✉</span>
                <a href="mailto:rabindra@example.com">
                    rabindra@example.com
                </a>
            </p>

            <p>
                <span class="icon">☎</span>
                <a href="tel:+821012345678">
                    +82 10-1234-5678
                </a>
            </p>

            <p>
                <span class="icon">⌖</span>
                Seoul, South Korea
            </p>

            <p>
                <span class="icon">↗</span>
                <a href="https://example.com">
                    www.yourwebsite.com
                </a>
            </p>
        </div>

        <div class="divider"></div>

        <footer class="card-footer">
            <p>CREATIVITY · QUALITY · PROFESSIONALISM</p>

            <div class="social-links">
                <a href="https://www.linkedin.com/"
                   target="_blank" rel="noopener noreferrer">LinkedIn</a>

                <a href="https://github.com/"
                   target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </footer>

    </main>

</body>
</html>
